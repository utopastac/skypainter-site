<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skypainter</title>
    <meta
      name="description"
      content="Skypainter is a drawing app for painting light across a sky and a globe — on the web now, on iOS soon."
    />
    <link rel="canonical" href="https://skypainter.f-90.co.uk/" />
    <link rel="icon" href="./assets/app-icon-64.png?v=2" type="image/png" />
    <link rel="apple-touch-icon" href="./assets/app-icon-256.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./home.css?v=12" />

  <body class="home">
    <main>
      <section class="stage" aria-label="Skypainter">
        <h1 class="logotype">Skypainter</h1>
        <div class="strokes">
          <canvas id="strokes" aria-hidden="true"></canvas>
        </div>
        <nav class="ctaRow" aria-label="Get Skypainter">
          <a class="cta" href="./web/">Web</a>
          <a
            class="cta ctaSoon"
            href="https://apps.apple.com/"
            id="ios-store"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="ctaLabel">iOS</span>
            <span class="ctaMeta">Coming soon</span>
          </a>
        </nav>
      </section>
    </main>

    <footer class="siteFooter">
      <div class="frame">
        <div>
          <p>Paint light across a sky and a globe. Web now · iOS coming soon.</p>
          <p>
            A product from
            <a href="https://f-90.co.uk">f-90</a>
          </p>
          <p>© <span id="y"></span> Skypainter</p>
        </div>
        <nav class="footerLinks" aria-label="Legal">
          <a href="./support/">Support</a>
          <a href="./privacy/">Privacy</a>
        </nav>
      </div>
    </footer>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./strokes.js?v=36"></script>
    <script src="./site.js?v=8"></script>
